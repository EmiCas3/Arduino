openapi: 3.0.3

info:
  title: SmartGreenAI - Radish Crop API
  version: 1.1.0
  description: |
    Contrato REST entre la Raspberry Pi (gateway), el backend en la nube y el
    dashboard web. Cubre SYS-01 y define lo que implementan CONF-04 (registro),
    MON-03 (cliente de transmision en la Pi) y MON-04 (ingesta y almacenamiento).

    **v1.1.0 (Sprint 2):** agrega sesiones de usuario (AUTH-01), control de
    acceso por rol (AUTH-02), registro de actuadores (CONF-05) y ultimas
    lecturas (DASH-01).

    ## Convenciones que no se negocian

    1. **`null` = sensor caido. `0` = lectura real.** Cualquier campo de medicion
       puede venir en `null`. El backend NUNCA debe convertir `null` a 0 ni
       descartar la lectura completa por eso: el resto de los sensores sigue
       siendo valido.
    2. **Se guardan `raw` y `pct` juntos.** El `raw` es la verdad del sensor y no
       cambia; el `pct` depende de una calibracion que si va a cambiar. Guardando
       los dos se puede recalcular el historico completo al recalibrar.
    3. **El timestamp lo pone la Pi, no el Arduino.** El campo `ms` del Arduino es
       milisegundos desde su boot y se reinicia en cada reset: sirve para detectar
       reinicios, no para ordenar en el tiempo.
    4. **La ingesta recibe lotes.** La Pi solo tiene internet cuando la laptop esta
       encendida, asi que acumula en SQLite y sincroniza despues. Mandar de una en
       una rompe ese diseño.

    ## Dos formas de autenticarse

    - **Dispositivos** (la Pi): header `X-API-Key`. Solo para la ingesta.
    - **Usuarios** (dashboard): `Authorization: Bearer <jwt>` obtenido en
      `POST /auth/login`. La sesion se cierra tras 30 min sin actividad
      (configurable) y dura como maximo 8 h.

    ## Roles

    | Rol | Puede |
    |---|---|
    | `producer` | Ver su vivero asignado y sus actuadores activos |
    | `admin` | Todo lo anterior en cualquier vivero + registrar y editar actuadores |
    | `super_admin` | Todo lo de `admin` (+ roles y bitacora en sprints futuros) |

    Rol insuficiente → **403** y la accion no se ejecuta. Sin token o con token
    vencido → **401**. El rol se lee de la BD en cada request.

    ## Nota sobre el formato de error

    El backend responde los errores como `{"detail": {"error", "message"}}`
    (schema `ErrorDetail`). Los endpoints de v1.0.0 documentan `Error` sin el
    envoltorio `detail`; se deja asi para no romper al cliente de la Pi hasta
    que el equipo decida unificarlo.

  contact:
    name: RadishSoftware - UPAEP, Agile Project Management
  license:
    name: Uso academico

servers:
  - url: https://api.smartgreenai.example/api/v1
    description: Produccion (pendiente de definir host real)
  - url: http://localhost:8000/api/v1
    description: Desarrollo local

tags:
  - name: devices
    description: Registro y consulta de dispositivos IoT (CONF-04)
  - name: ingest
    description: Ingesta de mediciones desde el gateway (MON-03 / MON-04)
  - name: readings
    description: Consulta de mediciones para el dashboard
  - name: auth
    description: Sesiones de usuario (AUTH-01)
  - name: actuators
    description: Registro de actuadores (CONF-05)

security:
  - ApiKeyAuth: []

paths:

  /devices:
    post:
      tags: [devices]
      summary: Registrar un dispositivo IoT
      description: |
        Da de alta un gateway (Raspberry Pi) o un sensor bajo un vivero.
        Devuelve la API key que ese dispositivo usara para la ingesta.
        La key se muestra UNA sola vez.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Dispositivo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWithKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ya existe un dispositivo con ese `device_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [devices]
      summary: Listar dispositivos
      operationId: listDevices
      parameters:
        - name: greenhouse_id
          in: query
          description: Filtrar por vivero
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      summary: Obtener un dispositivo
      operationId: getDevice
      responses:
        '200':
          description: Dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{device_id}/readings:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [ingest]
      summary: Enviar un lote de mediciones
      description: |
        Endpoint que llama la Raspberry Pi. Acepta de 1 a 500 lecturas por
        request. La API key del header debe pertenecer al `device_id` de la ruta.

        Idempotencia: si llega una lectura con el mismo `device_id` + `ts` que
        una ya almacenada, se ignora y se cuenta en `duplicates`. Esto permite
        que la Pi reintente sin miedo a duplicar datos si el POST llego pero la
        respuesta se perdio.

        Validacion parcial: si algunas lecturas del lote son invalidas, las
        validas SI se guardan y las rechazadas se listan en `rejected` con su
        indice. Solo se devuelve 400 si el lote entero es ilegible.
      operationId: ingestReadings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingBatch'
      responses:
        '202':
          description: Lote aceptado para almacenamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            El `device_id` no esta registrado. La Pi debe darse de alta via
            CONF-04 antes de poder enviar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Lote mayor a 500 lecturas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /greenhouses/{greenhouse_id}/readings:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [readings]
      summary: Consultar mediciones de un vivero
      description: Lo que consume el dashboard web para las graficas historicas.
      operationId: listReadings
      parameters:
        - name: from
          in: query
          description: Inicio del rango, ISO 8601 UTC
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fin del rango, ISO 8601 UTC
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Mediciones ordenadas por `ts` descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Sprint 2: sesiones de usuario (AUTH-01 / AUTH-02) ─────────────────

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesion
      description: |
        Recibe usuario O email y contrasena. Si son validos crea una sesion y
        devuelve un JWT para el header `Authorization: Bearer <token>`.

        Cualquier credencial invalida (usuario inexistente, contrasena
        incorrecta o usuario inactivo) responde el MISMO 401 generico, sin
        decir que campo fallo, y NO crea sesion.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesion
      description: Revoca la sesion actual. El token deja de servir de inmediato.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sesion cerrada
        '401':
          $ref: '#/components/responses/SessionRequired'

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario de la sesion actual
      description: El frontend lo usa para conocer el rol y armar el menu.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/SessionRequired'

  # ── Sprint 2: actuadores (CONF-05) ────────────────────────────────────

  /actuators:
    post:
      tags: [actuators]
      summary: Registrar un actuador
      description: |
        Solo `admin` y `super_admin`. Registra un equipo instalado en un vivero
        con su area y su canal de control. Un canal no puede estar ocupado por
        dos actuadores ACTIVOS del mismo vivero.
      operationId: registerActuator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuatorCreate'
      responses:
        '201':
          description: Actuador registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El gateway indicado no esta registrado (`gateway_not_registered`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: |
            Id repetido (`actuator_already_exists`) o canal ocupado por otro
            actuador activo del vivero (`control_channel_in_use`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [actuators]
      summary: Listar actuadores
      description: |
        Lo que consumen las pantallas de control. Por defecto solo los activos.
        Un `producer` solo ve los de su vivero asignado y no puede pedir
        `status=inactive` (403).
      operationId: listActuators
      security:
        - BearerAuth: []
      parameters:
        - name: greenhouse_id
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ActuatorType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActuatorStatus'
      responses:
        '200':
          description: Actuadores, ordenados por vivero, area y nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /actuators/{actuator_id}:
    parameters:
      - $ref: '#/components/parameters/ActuatorId'
    get:
      tags: [actuators]
      summary: Obtener un actuador
      description: Para un `producer`, un actuador inactivo o de otro vivero responde 404.
      operationId: getActuator
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Actuador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          description: No existe o no es visible para el usuario (`actuator_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    patch:
      tags: [actuators]
      summary: Editar, desactivar o reactivar un actuador
      description: |
        Solo `admin` y `super_admin`. `status: inactive` lo quita de las
        pantallas de control SIN borrar su historial (no existe DELETE).
        `type` y `greenhouse_id` no se pueden editar.
      operationId: updateActuator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuatorUpdate'
      responses:
        '200':
          description: Actuador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El actuador no existe (`actuator_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Al reactivar o cambiar de canal, el canal ya esta ocupado (`control_channel_in_use`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── Sprint 2: ultimas lecturas (DASH-01) ──────────────────────────────

  /greenhouses/{greenhouse_id}/readings/latest:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [readings]
      summary: Ultimas lecturas de un vivero
      description: |
        Ultimo valor NO nulo de cada medicion con unidad, antiguedad y bandera
        `stale` (mas vieja que `SMARTGREENAI_READING_STALE_MINUTES`, 15 por
        defecto). `sensor_down` indica que la lectura mas reciente del vivero
        llego con ese sensor en `null`. Un `producer` solo consulta su vivero
        asignado. Si el vivero no tiene lecturas responde `has_data: false`.
      operationId: getLatestReadings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado actual del vivero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadings'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Key emitida al registrar el dispositivo. Para el prototipo es
        suficiente; no es apto para produccion real.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token obtenido en `POST /auth/login`. Solo identifica la sesion; el
        rol se valida contra la BD en cada request.

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Identificador unico del dispositivo, ej. `pi-vivero-01`
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
    ActuatorId:
      name: actuator_id
      in: path
      required: true
      description: Identificador unico del actuador, ej. `bomba-riego-01`
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{2,49}$'

  schemas:

    DeviceCreate:
      type: object
      required: [device_id, greenhouse_id, type]
      properties:
        device_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: pi-vivero-01
        greenhouse_id:
          type: string
          description: FK al vivero al que pertenece
          example: vivero-rabano-01
        type:
          type: string
          enum: [gateway, sensor, actuator]
        model:
          type: string
          example: Raspberry Pi 1 Model B+ v1.2
        location:
          type: string
          description: Descripcion libre de donde esta fisicamente
          example: Mesa del laboratorio, junto al tanque

    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceCreate'
        - type: object
          properties:
            status:
              type: string
              enum: [active, inactive]
            registered_at:
              type: string
              format: date-time
            last_seen_at:
              type: string
              format: date-time
              nullable: true
              description: '`null` si nunca ha enviado una lectura'

    DeviceWithKey:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            api_key:
              type: string
              description: Se devuelve UNA sola vez, al registrar

    ReadingBatch:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Reading'

    Reading:
      type: object
      description: |
        Una lectura del Arduino, enriquecida por la Pi con el timestamp.
        Los nombres de campo son exactamente los que imprime el sketch
        `vivero_sensores.ino` por Serial: la Pi no renombra nada, solo agrega
        `ts` y reenvia.
      required: [ts]
      properties:
        ts:
          type: string
          format: date-time
          description: |
            Momento de la lectura en ISO 8601 UTC. Lo asigna la Raspberry Pi
            al recibir la linea por Serial, NO el Arduino.
          example: '2026-09-13T21:04:22Z'
        ms:
          type: integer
          format: int64
          description: |
            Milisegundos desde el boot del Arduino. Sirve para detectar
            reinicios (si baja respecto a la lectura anterior, hubo reset).
            No usar para ordenar en el tiempo.
          example: 148022

        temp_c:
          type: number
          format: float
          nullable: true
          description: Temperatura del aire en grados Celsius (DHT11)
          example: 24.2
        hum_aire_pct:
          type: number
          format: float
          nullable: true
          description: Humedad relativa del aire en % (DHT11)
          example: 72.0

        suelo_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: 'Lectura ADC cruda del sensor capacitivo. Mas seco = mas alto'
          example: 380
        suelo_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            Humedad de tierra en %, derivada de `suelo_raw` con la calibracion
            vigente. Es un valor relativo a esa calibracion, no humedad
            volumetrica del suelo.
          example: 62

        nivel_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          example: 150
        nivel_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            Nivel del tanque en %. Mide solo el tramo que cubre el sensor, no
            el volumen total del tanque. `0` es un tanque vacio real; sensor
            desconectado llega como `null`.
          example: 75

        luz_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: Lectura cruda del sensor de luz, sin calibrar a lux
          example: 306
        luz_nivel:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: |
            La misma lectura normalizada a "mas alto = mas luz", para que el
            backend no necesite saber la polaridad del sensor.
          example: 717

        es_dia:
          type: boolean
          description: |
            Dia o noche deducido del propio sensor de luz (el Arduino no tiene
            reloj). El dashboard no debe alertar por falta de sol cuando es
            `false`.
        sol_min_hoy:
          type: integer
          minimum: 0
          description: Minutos de sol pleno acumulados en el dia en curso
          example: 42
        sol_min_prev:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Minutos de sol del dia anterior ya cerrado. `null` mientras no se
            haya completado un ciclo dia-noche desde el ultimo reinicio.
          example: 410

        riego_sugerido:
          type: boolean
          description: |
            El Arduino sugiere regar. Es una recomendacion, no una orden:
            el principio del proyecto es decision support, not autonomy.
        bomba_habilitada:
          type: boolean
          description: |
            `false` cuando el nivel esta en critico o el sensor de nivel fallo.
            Bloqueo de seguridad: la bomba es sumergible y se quema en seco.
        vent:
          type: string
          enum: [BASE, ALTA]
          description: |
            Ventilacion recomendada. `BASE` es la ventilacion constante que el
            cultivo requiere siempre; `ALTA` por calor o exceso de humedad.

        estado:
          type: string
          enum: [OK, AVISO, ALERTA]
          description: |
            Resumen de la lectura. `AVISO` = fuera del rango ideal del rabano;
            `ALERTA` = fuera de limite o sensor caido.
        alertas:
          type: array
          description: |
            Codigos activos en esta lectura. Enum cerrado: si el firmware agrega
            uno nuevo, se actualiza este spec primero.
          items:
            type: string
            enum:
              - TEMP_ALTA
              - TEMP_BAJA
              - TEMP_ALTA_LEVE
              - TEMP_BAJA_LEVE
              - HUM_AIRE_ALTA
              - HUM_AIRE_BAJA
              - HUM_AIRE_ALTA_LEVE
              - HUM_AIRE_BAJA_LEVE
              - SUELO_ENCHARCADO
              - SUELO_SECO
              - SUELO_HUMEDO_LEVE
              - SUELO_SECO_LEVE
              - TANQUE_MITAD
              - TANQUE_UN_CUARTO
              - SOMBRA_PROLONGADA
              - SOL_INSUFICIENTE
              - FALLA_DHT
              - FALLA_SUELO
              - FALLA_NIVEL
          example: [SUELO_SECO, TANQUE_MITAD]

    StoredReading:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
            device_id:
              type: string
            greenhouse_id:
              type: string
            received_at:
              type: string
              format: date-time
              description: |
                Cuando el backend recibio la lectura. Distinto de `ts` cuando
                la Pi estuvo sin internet y sincronizo despues.
        - $ref: '#/components/schemas/Reading'

    IngestResult:
      type: object
      properties:
        accepted:
          type: integer
          description: Lecturas almacenadas
          example: 118
        duplicates:
          type: integer
          description: Ignoradas por `device_id` + `ts` repetido
          example: 2
        rejected:
          type: array
          description: Lecturas invalidas del lote, con su indice en el array
          items:
            type: object
            properties:
              index:
                type: integer
              reason:
                type: string
          example:
            - index: 44
              reason: 'ts ausente o mal formado'

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Codigo estable, legible por maquina
          example: device_not_registered
        message:
          type: string
          description: Explicacion para humanos
          example: 'El dispositivo pi-vivero-01 no esta registrado'

    # ── Sprint 2: usuarios ────────────────────────────────────────────

    Role:
      type: string
      enum: [producer, admin, super_admin]
      description: |
        `producer` = Radish Producer, `admin` = Administrator,
        `super_admin` = Super Administrator.

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Usuario o email (no distingue mayusculas)
          example: productor
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    UserPublic:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
          example: productor
        email:
          type: string
          example: productor@smartgreen.local
        full_name:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        greenhouse_id:
          type: string
          nullable: true
          description: Vivero asignado a un productor. `null` para administradores.
          example: vivero-rabano-01

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_at, idle_timeout_minutes, user]
      properties:
        access_token:
          type: string
          description: 'JWT HS256 para el header `Authorization: Bearer <token>`'
        token_type:
          type: string
          example: bearer
        expires_at:
          type: string
          format: date-time
          description: Vencimiento absoluto de la sesion (8 h por defecto)
        idle_timeout_minutes:
          type: integer
          description: La sesion se cierra tras estos minutos sin actividad
          example: 30
        user:
          $ref: '#/components/schemas/UserPublic'

    # ── Sprint 2: actuadores ──────────────────────────────────────────

    ActuatorType:
      type: string
      enum: [pump, fan, shade, light]
      description: bomba de riego, ventilador, malla sombra, iluminacion

    ActuatorStatus:
      type: string
      enum: [active, inactive]

    ActuatorCreate:
      type: object
      required: [actuator_id, name, type, greenhouse_id, area, control_channel]
      properties:
        actuator_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: bomba-riego-01
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Bomba de riego
        type:
          $ref: '#/components/schemas/ActuatorType'
        greenhouse_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: vivero-rabano-01
        area:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
          example: general
        control_channel:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9/_.:-]{0,49}$'
          description: Canal fisico que lo controla (driver/pin)
          example: L298N-B/D5
        gateway_device_id:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          description: Gateway registrado del mismo vivero que le enviara comandos
          example: pi-vivero-01
        model:
          type: string
          nullable: true
          maxLength: 120
          example: Bomba sumergible 12 V, canal B del L298N

    ActuatorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo estos campos son editables. `type` y `greenhouse_id` no.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        area:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
        control_channel:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9/_.:-]{0,49}$'
        model:
          type: string
          nullable: true
          maxLength: 120
        status:
          $ref: '#/components/schemas/ActuatorStatus'

    Actuator:
      allOf:
        - $ref: '#/components/schemas/ActuatorCreate'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/ActuatorStatus'
            registered_at:
              type: string
              format: date-time
            registered_by:
              type: integer
              nullable: true
              description: Id del usuario que lo registro
            updated_at:
              type: string
              format: date-time
              nullable: true
            deactivated_at:
              type: string
              format: date-time
              nullable: true

    # ── Sprint 2: ultimas lecturas ────────────────────────────────────

    LatestMetric:
      type: object
      required: [key, label, unit, stale, sensor_down]
      properties:
        key:
          type: string
          enum: [temp_c, hum_aire_pct, suelo_pct, nivel_pct, luz_nivel]
        label:
          type: string
          example: Temperatura del aire
        unit:
          type: string
          example: °C
        value:
          type: number
          nullable: true
          description: Ultimo valor NO nulo. `null` si nunca ha llegado uno.
          example: 24.2
        raw:
          type: integer
          nullable: true
          description: Lectura ADC cruda del mismo momento (suelo, nivel y luz)
        ts:
          type: string
          format: date-time
          nullable: true
        age_seconds:
          type: integer
          nullable: true
        stale:
          type: boolean
        sensor_down:
          type: boolean
        device_id:
          type: string
          nullable: true
        device_location:
          type: string
          nullable: true

    LatestReadingSummary:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        age_seconds:
          type: integer
        stale:
          type: boolean
        device_id:
          type: string
        estado:
          type: string
          enum: [OK, AVISO, ALERTA]
          nullable: true
        alertas:
          type: array
          items:
            type: string
        riego_sugerido:
          type: boolean
          nullable: true
        bomba_habilitada:
          type: boolean
          nullable: true
        vent:
          type: string
          enum: [BASE, ALTA]
          nullable: true
        es_dia:
          type: boolean
          nullable: true

    LatestReadings:
      type: object
      required: [greenhouse_id, generated_at, stale_after_minutes, has_data, metrics]
      properties:
        greenhouse_id:
          type: string
        generated_at:
          type: string
          format: date-time
        stale_after_minutes:
          type: integer
          example: 15
        has_data:
          type: boolean
        last_reading:
          allOf:
            - $ref: '#/components/schemas/LatestReadingSummary'
          nullable: true
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/LatestMetric'

    ErrorDetail:
      type: object
      description: |
        Formato real de los errores que lanza el backend (FastAPI envuelve el
        error en `detail`). Ver la nota en la descripcion del API.
      properties:
        detail:
          $ref: '#/components/schemas/Error'

  responses:
    BadRequest:
      description: Payload invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: API key ausente, invalida o de otro dispositivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionRequired:
      description: |
        Sin token (`missing_token`), token invalido o vencido (`invalid_token`)
        o sesion terminada / inactiva mas de 30 min (`session_expired`).
        Incluye el header `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    Forbidden:
      description: El rol del usuario no tiene permiso (`forbidden`). La accion no se ejecuta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    ValidationError:
      description: Cuerpo o parametros invalidos (validacion de FastAPI)
