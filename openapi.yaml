openapi: 3.0.3

info:
  title: SmartGreenAI - Radish Crop API
  version: 1.5.1
  description: |
    Contrato REST entre la Raspberry Pi (gateway), el backend en la nube y el
    dashboard web. Cubre SYS-01 y define lo que implementan CONF-04 (registro),
    MON-03 (cliente de transmision en la Pi) y MON-04 (ingesta y almacenamiento).

    **v1.1.0 (Sprint 2):** agrega sesiones de usuario (AUTH-01), control de
    acceso por rol (AUTH-02), registro de actuadores (CONF-05) y ultimas
    lecturas (DASH-01).

    **v1.2.0 (Sprint 2):** ajuste de MON-04 para el gateway de la Pi (MON-03).
    `ts` debe traer zona horaria y se guarda en UTC con milisegundos; se
    rechazan horas imposibles (reloj sin sincronizar o del futuro) y la
    validacion es lectura por lectura: una lectura mala ya no tumba el lote.

    **v1.3.0 (Sprint 2):** soporte para los widgets del dashboard (DASH-01).
    Agrega `GET /greenhouses` (viveros que el usuario puede consultar), el campo
    `area` en las ultimas lecturas y el header opcional `X-SG-Background` para
    que el refresco automatico del dashboard no renueve la sesion.

    **v1.4.0 (Sprint 2, cierre):** estado de los actuadores (ACT-04). La
    lectura acepta `bomba_activa` y `vent_activo` del firmware y
    `GET /greenhouses/{greenhouse_id}/actuators/status` devuelve cada equipo
    como `on`, `off`, `unavailable` o `unknown` (nunca `off` sin confirmacion).
    Alertas (ALERT-01): los umbrales viven en el firmware; cuando el Arduino
    manda un codigo de LIMITE, el backend crea una alerta (una sola mientras
    la condicion siga) y `GET /greenhouses/{greenhouse_id}/alerts` la devuelve
    con sensor, valor, umbral y hora.
    Riego (ACT-02): el Arduino decide el riego automatico con sus constantes;
    la plataforma guarda el modo (`PUT /greenhouses/{greenhouse_id}/irrigation/mode`),
    manda ordenes manuales a la bomba (`POST /actuators/{actuator_id}/commands`)
    que viajan en `commands` de la respuesta de la ingesta, y registra cada
    encendido/apagado como automatico o manual
    (`GET /greenhouses/{greenhouse_id}/actuators/events`). La lectura agrega
    `modo`, `cmd_id`, `cmd_err` y `bomba_paro`.

    **v1.5.0 (Sprint 3):** historico y analisis. Graficas (DASH-02):
    `GET /greenhouses/{greenhouse_id}/readings` devuelve las lecturas
    guardadas de un rango y
    `GET /greenhouses/{greenhouse_id}/readings/series` devuelve UNA medicion
    lista para dibujar, promediada por bucket (con el minimo y el maximo de
    cada uno) cuando en el rango hay mas lecturas que `max_points`; un rango
    valido sin lecturas responde 200 con `has_data: false`.
    Analisis (AI-01): `GET /greenhouses/{greenhouse_id}/analysis` devuelve,
    por medicion, un indicador de tendencia (`rising`, `stable`, `falling` o
    `insufficient_data`), la pendiente por hora, el cambio estimado, el
    periodo usado y la calidad del dato: cobertura, huecos y cuantas lecturas
    traian ese sensor en `null`. Los huecos se reportan, nunca se rellenan.

    **v1.5.1 (Sprint 3, correcciones):** el analisis ya no deja fuera las
    lecturas del ultimo bucket (antes se perdian sin reportarse como hueco), y
    los huecos se recortan al rango pedido. `from` y `to` sin zona horaria, o
    en los extremos del calendario, se rechazan con 422 `invalid_range` (antes
    se tomaban como UTC o daban 500). `/readings/series` nunca devuelve mas de
    `max_points` puntos. El 422 documenta las dos formas reales: la de FastAPI
    (`HTTPValidationError`) y la del backend (`ErrorDetail`). `/readings`
    declara el header `X-SG-Background`. Sin rutas ni campos nuevos.

    ## Convenciones que no se negocian

    1. **`null` = sensor caido. `0` = lectura real.** Cualquier campo de medicion
       puede venir en `null`. El backend NUNCA debe convertir `null` a 0 ni
       descartar la lectura completa por eso: el resto de los sensores sigue
       siendo valido.
    2. **Se guardan `raw` y `pct` juntos.** El `raw` es la verdad del sensor y no
       cambia; el `pct` depende de una calibracion que si va a cambiar. Guardando
       los dos se puede recalcular el historico completo al recalibrar.
    3. **El timestamp lo pone la Pi, no el Arduino.** El campo `ms` del Arduino es
       milisegundos desde su boot y se reinicia en cada reset: sirve para detectar
       reinicios, no para ordenar en el tiempo. El backend nunca pone la hora de
       la lectura (solo `received_at`) y guarda `ts` en UTC con milisegundos.
    4. **La ingesta recibe lotes.** La Pi solo tiene internet cuando la laptop esta
       encendida, asi que acumula en SQLite y sincroniza despues. Mandar de una en
       una rompe ese diseño.

    ## Dos formas de autenticarse

    - **Dispositivos** (la Pi): header `X-API-Key`. Solo para la ingesta.
    - **Usuarios** (dashboard): `Authorization: Bearer <jwt>` obtenido en
      `POST /auth/login`. La sesion se cierra tras 30 min sin actividad
      (configurable) y dura como maximo 8 h.

    ### Refresco en segundo plano (`X-SG-Background`)

    Cada request con sesion cuenta como actividad y renueva el plazo de
    inactividad. El dashboard pide lecturas solo cada 15 s: si eso contara, una
    pestaña abierta mantendria la sesion viva para siempre. Por eso sus
    refrescos automaticos mandan `X-SG-Background: 1`: el servidor valida la
    sesion igual (401 si ya vencio) pero **no** la renueva. El header vale en
    cualquier endpoint con sesion y nunca da mas acceso. Cualquier otro valor
    se ignora.

    ## Roles

    | Rol | Puede |
    |---|---|
    | `producer` | Ver su vivero asignado y sus actuadores activos; cambiar el modo de riego y regar a mano en su vivero (v1.4.0) |
    | `admin` | Todo lo anterior en cualquier vivero + registrar y editar actuadores |
    | `super_admin` | Todo lo de `admin` (+ roles y bitacora en sprints futuros) |

    Rol insuficiente → **403** y la accion no se ejecuta. Sin token o con token
    vencido → **401**. El rol se lee de la BD en cada request.

    ## Nota sobre el formato de error

    El backend responde los errores como `{"detail": {"error", "message"}}`
    (schema `ErrorDetail`). Los endpoints de v1.0.0 documentan `Error` sin el
    envoltorio `detail`; se deja asi para no romper al cliente de la Pi hasta
    que el equipo decida unificarlo.

  contact:
    name: RadishSoftware - UPAEP, Agile Project Management
  license:
    name: Uso academico

servers:
  - url: https://api.smartgreenai.example/api/v1
    description: Produccion (pendiente de definir host real)
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
  - url: http://{pi_host}:8000/api/v1
    description: Raspberry Pi 5 del vivero (backend y gateway en la misma Pi)
    variables:
      pi_host:
        default: smartgreen.local
        description: Hostname o IP de la Pi en la red local

tags:
  - name: devices
    description: Registro y consulta de dispositivos IoT (CONF-04)
  - name: ingest
    description: Ingesta de mediciones desde el gateway (MON-03 / MON-04)
  - name: readings
    description: Consulta de mediciones para el dashboard
  - name: auth
    description: Sesiones de usuario (AUTH-01)
  - name: actuators
    description: Registro de actuadores (CONF-05)
  - name: control
    description: Estado de los equipos del vivero (ACT-04)
  - name: alerts
    description: Alertas por umbral del firmware (ALERT-01)
  - name: irrigation
    description: Riego automatico y manual (ACT-02)
  - name: analysis
    description: Analisis de la informacion historica (AI-01)

security:
  - ApiKeyAuth: []

paths:

  /devices:
    post:
      tags: [devices]
      summary: Registrar un dispositivo IoT
      description: |
        Da de alta un gateway (Raspberry Pi) o un sensor bajo un vivero.
        Devuelve la API key que ese dispositivo usara para la ingesta.
        La key se muestra UNA sola vez.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Dispositivo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWithKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ya existe un dispositivo con ese `device_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [devices]
      summary: Listar dispositivos
      operationId: listDevices
      parameters:
        - name: greenhouse_id
          in: query
          description: Filtrar por vivero
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      summary: Obtener un dispositivo
      operationId: getDevice
      responses:
        '200':
          description: Dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{device_id}/readings:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [ingest]
      summary: Enviar un lote de mediciones
      description: |
        Endpoint que llama la Raspberry Pi. Acepta de 1 a 500 lecturas por
        request. La API key del header debe pertenecer al `device_id` de la ruta.

        Idempotencia: si llega una lectura con el mismo `device_id` + `ts` que
        una ya almacenada, se ignora y se cuenta en `duplicates`. Esto permite
        que la Pi reintente sin miedo a duplicar datos si el POST llego pero la
        respuesta se perdio.

        Validacion parcial: si algunas lecturas del lote son invalidas, las
        validas SI se guardan y las rechazadas se listan en `rejected` con su
        indice. Solo se devuelve 400 si el lote entero es ilegible.

        Reglas de `ts` (v1.2.0):
        - Obligatorio, texto ISO 8601 y **con zona horaria** (`Z` o `-06:00`).
          Sin zona se rechaza: es ambiguo.
        - Se normaliza a UTC con milisegundos: `2026-09-26T18:04:22.123+00:00`.
          El mismo instante escrito en dos zonas cuenta como duplicado.
        - Se rechaza si es anterior a `SMARTGREENAI_MIN_READING_TS`
          (default 2026-01-01T00:00:00Z; una Pi sin hora cree que es 1970) o si
          va mas de `SMARTGREENAI_MAX_CLOCK_SKEW_SECONDS` (default 300) adelante
          del reloj del servidor.

        Motivos de `rejected` (texto `campo: motivo`):
        - `ts: sin zona horaria ...`
        - `ts: debe ser texto ISO 8601 ...` (tambien numeros u horas Unix)
        - `ts: anterior a ...; el reloj del gateway no esta sincronizado`
        - `ts: en el futuro, mas de 300 s adelante del servidor`
        - `ts: field required`
        - `<campo>: <error de validacion>`, por ejemplo `suelo_pct: ensure this
          value is less than or equal to 100`
        - `la lectura no es un objeto JSON`

        Los campos que el contrato no define se ignoran sin rechazar la
        lectura. Desde v1.4.0, `bomba_activa` y `vent_activo` SI se usan:
        actualizan el estado de los actuadores activos de ese gateway (ACT-04).

        Ordenes para el Arduino (v1.4.0, ACT-02): la respuesta 202 trae en
        `commands` las ordenes pendientes de ESTE gateway (cambio de modo u
        ordenes manuales a la bomba). El gateway las escribe por Serial como
        `SG,<id>,MODO,AUTO|MANUAL` o `SG,<id>,BOMBA,ON|OFF` y el Arduino las
        confirma en sus siguientes lecturas con `cmd_id` / `cmd_err`. Ver
        `gateway/PROTOCOLO_ARDUINO.md`. Un gateway viejo puede ignorar el campo.
      operationId: ingestReadings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingBatch'
      responses:
        '202':
          description: Lote aceptado para almacenamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            El `device_id` no esta registrado. La Pi debe darse de alta via
            CONF-04 antes de poder enviar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Lote mayor a 500 lecturas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            El sobre del lote es invalido: `readings` falta, no es arreglo, esta
            vacio o trae mas de 500 elementos. Nota: la implementacion actual
            responde 422 (validacion de FastAPI) tambien en el caso que este
            contrato marca como 413. Las lecturas individuales invalidas NO
            generan 422: van en `rejected`.

  /greenhouses/{greenhouse_id}/readings:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [readings]
      summary: Consultar mediciones de un vivero
      description: |
        Lecturas guardadas del rango, de la mas reciente a la mas antigua.
        Sin `from` ni `to` se devuelven las ultimas 24 h. Un `producer` solo
        consulta su vivero asignado.

        Es el dato crudo (revisar o exportar). Para dibujar una grafica usa
        `/readings/series`, que lo agrega cuando hay demasiados puntos.

        Los campos que el firmware manda pero que no viven en la tabla de
        lecturas (`bomba_activa`, `vent_activo`, `modo`, `cmd_id`, `cmd_err`,
        `bomba_paro`) salen en `null`: su estado se consulta en
        `/actuators/status` y en `/irrigation`.
      operationId: listReadings
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Background'
        - name: from
          in: query
          description: Inicio del rango (ISO 8601 CON zona; sin zona da 422). Por defecto, 24 h atras
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fin del rango (ISO 8601 CON zona; sin zona da 422). Por defecto, ahora
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Mediciones ordenadas por `ts` descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredReading'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRange'

  /greenhouses/{greenhouse_id}/readings/series:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [readings]
      summary: Serie historica de una medicion (DASH-02)
      description: |
        Lo que dibuja la grafica del historial: UNA medicion en el rango
        pedido, con su etiqueta, su unidad y sus puntos en orden de tiempo.

        **Resolucion.** Si en el rango hay `max_points` lecturas o menos, se
        devuelven tal cual (`aggregated: false`, `bucket_seconds: 0`). Si hay
        mas, se promedian por bucket y cada punto trae ademas el `min` y el
        `max` reales de ese bucket, para que promediar no esconda un pico.
        Los buckets se alinean con la epoca Unix (multiplos exactos de su
        tamano), asi que dos consultas del mismo periodo caen en los mismos
        buckets.

        **Sin datos.** Un rango valido sin lecturas NO es un error: responde
        200 con `has_data: false` y `points: []`, para que la pagina muestre
        un aviso en vez de una grafica vacia.

        **Rango.** Sin `from` ni `to` se consultan las ultimas 24 h. Un rango
        invertido o de mas de 90 dias responde 422 `invalid_range`.
      operationId: getReadingSeries
      security:
        - BearerAuth: []
      parameters:
        - name: metric
          in: query
          description: Medicion a graficar
          schema:
            $ref: '#/components/schemas/MetricKey'
        - name: from
          in: query
          description: Inicio del rango (ISO 8601 CON zona; sin zona da 422). Por defecto, 24 h atras
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fin del rango (ISO 8601 CON zona; sin zona da 422). Por defecto, ahora
          schema:
            type: string
            format: date-time
        - name: max_points
          in: query
          description: Puntos que se devuelven como maximo
          schema:
            type: integer
            minimum: 10
            maximum: 1000
            default: 240
      responses:
        '200':
          description: Serie lista para dibujar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSeries'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRange'

  /greenhouses/{greenhouse_id}/analysis:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [analysis]
      summary: Tendencias del vivero en un periodo (AI-01)
      description: |
        Analiza las lecturas guardadas del rango y devuelve, por medicion, si
        va subiendo, estable o bajando, con la pendiente por hora, el cambio
        estimado y la calidad del dato.

        **Como se calcula.** Las lecturas se promedian por bucket (igual que
        la grafica) y sobre esa serie se ajusta una recta por minimos
        cuadrados. `stable` no es "pendiente cero": es que el cambio del
        periodo no pasa de `stable_band`, la banda de ruido de esa medicion.
        `fit_r2` dice que tan recta es la serie: un valor bajo significa que
        la medicion se movio, pero no en linea recta (por ejemplo el ciclo
        dia/noche de la temperatura en una ventana de 24 h).

        **Huecos.** Los buckets sin lectura NO se rellenan: se devuelven en
        `gaps`, y `readings_missing` cuenta las lecturas del rango que traian
        esa medicion en `null` (sensor caido). `coverage_pct` dice que parte
        del periodo se midio de verdad.

        **Reproducible.** El resultado sale solo de las lecturas guardadas y
        del periodo pedido: el mismo rango sobre los mismos datos da siempre
        lo mismo. `generated_at` es metadato de la respuesta, no entra en el
        calculo.

        Aqui no se redacta ninguna recomendacion: eso es AI-05.
      operationId: getGreenhouseAnalysis
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          description: Inicio del periodo (ISO 8601 CON zona; sin zona da 422). Por defecto, 24 h atras
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fin del periodo (ISO 8601 CON zona; sin zona da 422). Por defecto, ahora
          schema:
            type: string
            format: date-time
        - name: bucket_seconds
          in: query
          description: |
            Tamano del bucket. Por defecto se elige segun el rango (el mismo
            que usa la grafica). Si parte el rango en mas de 1000 tramos
            responde 422.
          schema:
            type: integer
            minimum: 10
            maximum: 86400
      responses:
        '200':
          description: Tendencias por medicion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreenhouseAnalysis'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRange'

  # ── Sprint 2: sesiones de usuario (AUTH-01 / AUTH-02) ─────────────────

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesion
      description: |
        Recibe usuario O email y contrasena. Si son validos crea una sesion y
        devuelve un JWT para el header `Authorization: Bearer <token>`.

        Cualquier credencial invalida (usuario inexistente, contrasena
        incorrecta o usuario inactivo) responde el MISMO 401 generico, sin
        decir que campo fallo, y NO crea sesion.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesion
      description: Revoca la sesion actual. El token deja de servir de inmediato.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Sesion cerrada
        '401':
          $ref: '#/components/responses/SessionRequired'

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario de la sesion actual
      description: El frontend lo usa para conocer el rol y armar el menu.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/SessionRequired'

  # ── Sprint 2: actuadores (CONF-05) ────────────────────────────────────

  /actuators:
    post:
      tags: [actuators]
      summary: Registrar un actuador
      description: |
        Solo `admin` y `super_admin`. Registra un equipo instalado en un vivero
        con su area y su canal de control. Un canal no puede estar ocupado por
        dos actuadores ACTIVOS del mismo vivero.
      operationId: registerActuator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuatorCreate'
      responses:
        '201':
          description: Actuador registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El gateway indicado no esta registrado (`gateway_not_registered`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: |
            Id repetido (`actuator_already_exists`) o canal ocupado por otro
            actuador activo del vivero (`control_channel_in_use`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [actuators]
      summary: Listar actuadores
      description: |
        Lo que consumen las pantallas de control. Por defecto solo los activos.
        Un `producer` solo ve los de su vivero asignado y no puede pedir
        `status=inactive` (403).
      operationId: listActuators
      security:
        - BearerAuth: []
      parameters:
        - name: greenhouse_id
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ActuatorType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActuatorStatus'
      responses:
        '200':
          description: Actuadores, ordenados por vivero, area y nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /actuators/{actuator_id}:
    parameters:
      - $ref: '#/components/parameters/ActuatorId'
    get:
      tags: [actuators]
      summary: Obtener un actuador
      description: Para un `producer`, un actuador inactivo o de otro vivero responde 404.
      operationId: getActuator
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Actuador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          description: No existe o no es visible para el usuario (`actuator_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    patch:
      tags: [actuators]
      summary: Editar, desactivar o reactivar un actuador
      description: |
        Solo `admin` y `super_admin`. `status: inactive` lo quita de las
        pantallas de control SIN borrar su historial (no existe DELETE).
        `type` y `greenhouse_id` no se pueden editar.
      operationId: updateActuator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuatorUpdate'
      responses:
        '200':
          description: Actuador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuator'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El actuador no existe (`actuator_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Al reactivar o cambiar de canal, el canal ya esta ocupado (`control_channel_in_use`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── Sprint 2: ultimas lecturas (DASH-01) ──────────────────────────────

  /actuators/{actuator_id}/commands:
    parameters:
      - $ref: '#/components/parameters/ActuatorId'
    post:
      tags: [irrigation]
      summary: Encender o apagar la bomba a mano (ACT-02)
      description: |
        Solo con el riego en modo `manual` (en automatico decide el Arduino) y
        solo para la bomba. La orden queda `pending`, sale hacia el gateway en
        la respuesta de su siguiente envio de lecturas (`sent`) y el Arduino
        la confirma en su siguiente lectura (`confirmed` o `rejected`). Sin
        confirmacion en `SMARTGREENAI_COMMAND_ACK_SECONDS` (45) queda
        `expired`. Encender dura como maximo `BOMBA_MAX_MS` del firmware. Una
        orden nueva reemplaza a la que aun no salia (`superseded`).

        Errores: 404 si el actuador no existe, esta desactivado o es de otro
        vivero; 422 `not_controllable` si no es la bomba; 409 `auto_mode`,
        `tank_low`, `no_gateway`, `firmware_without_control`,
        `gateway_inactive` o `no_report`. Todos los roles; un `producer` solo
        los equipos de su vivero.
      operationId: commandActuator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandCreate'
      responses:
        '202':
          description: Orden guardada; sale en el siguiente envio del gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOut'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          description: El actuador no esta registrado, esta desactivado o no es visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: No se puede mandar la orden ahora (ver la descripcion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /greenhouses:
    get:
      tags: [readings]
      summary: Viveros que el usuario puede consultar
      description: |
        Lista los viveros con al menos un dispositivo registrado. Un `producer`
        recibe solo su vivero asignado (o una lista vacia si no tiene);
        `admin` y `super_admin` reciben todos. Lo usa el dashboard para que un
        Administrador, que no tiene vivero asignado, elija cual ver.
      operationId: listGreenhouses
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Background'
      responses:
        '200':
          description: Viveros visibles para el usuario, ordenados por id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GreenhouseSummary'
        '401':
          $ref: '#/components/responses/SessionRequired'

  /greenhouses/{greenhouse_id}/readings/latest:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [readings]
      summary: Ultimas lecturas de un vivero
      description: |
        Ultimo valor NO nulo de cada medicion con unidad, area, antiguedad y
        bandera `stale` (mas vieja que `SMARTGREENAI_READING_STALE_MINUTES`,
        15 por defecto). `sensor_down` indica que la lectura mas reciente del
        vivero llego con ese sensor en `null`. Un `producer` solo consulta su
        vivero asignado. Si el vivero no tiene lecturas responde
        `has_data: false`.

        Es lo que consumen los widgets del dashboard, que la piden cada 15 s
        con `X-SG-Background: 1`.
      operationId: getLatestReadings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado actual del vivero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadings'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /greenhouses/{greenhouse_id}/actuators/status:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [control]
      summary: Estado actual de cada actuador (ACT-04)
      description: |
        Actuadores ACTIVOS del vivero con su estado. El backend lo calcula con
        el ultimo `bomba_activa` / `vent_activo` que mando el Arduino:

        | `state` | Cuando |
        |---|---|
        | `on` / `off` | El Arduino lo confirmo hace menos de `SMARTGREENAI_READING_STALE_MINUTES` |
        | `unavailable` | Bomba bloqueada por el firmware (`bomba_habilitada: false`, tanque critico) o gateway desactivado |
        | `unknown` | Nunca lo reporto, la confirmacion es vieja, no tiene gateway o es un tipo que el firmware no reporta (`shade`, `light`) |

        Un equipo sin confirmacion **nunca** se reporta como `off`. El
        dashboard lo pide cada 15 s con `X-SG-Background: 1`. Todos los
        roles; un `producer` solo su vivero (403 si pide otro).
      operationId: getActuatorStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado de los equipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorLiveList'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /greenhouses/{greenhouse_id}/irrigation:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [irrigation]
      summary: Modo de riego y si el Arduino acepta ordenes (ACT-02)
      description: |
        `mode` es el que eligio una persona (`auto` por defecto, igual que el
        Arduino al arrancar). `reported_mode` es el que reporta el Arduino
        (`null` si su firmware no acepta ordenes). `controllable` dice si se
        le pueden mandar ordenes y `detail` por que no. `firmware` trae el
        objetivo, el tiempo maximo y el descanso que usa el Arduino (viven en
        el firmware). Todos los roles; un `producer` solo su vivero.
      operationId: getIrrigation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado del riego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationStatus'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /greenhouses/{greenhouse_id}/irrigation/mode:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [irrigation]
      summary: Cambiar a riego automatico o manual (ACT-02)
      description: |
        Guarda el modo elegido (quien y cuando) y le manda la orden al
        Arduino por el gateway. En `manual` el Arduino no riega solo y, si
        estaba regando, apaga la bomba. Si el Arduino se reinicia (vuelve a
        AUTO), el backend se lo vuelve a mandar solo. 409 si no se le pueden
        mandar ordenes (`no_pump`, `gateway_inactive`, `no_report`,
        `firmware_without_control`). Todos los roles; un `producer` solo su
        vivero.
      operationId: setIrrigationMode
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeChange'
      responses:
        '200':
          description: Modo guardado y orden en camino
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationStatus'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Al Arduino no se le pueden mandar ordenes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /greenhouses/{greenhouse_id}/actuators/events:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [irrigation]
      summary: Ultimos encendidos y apagados (ACT-02)
      description: |
        Cada encendido o apagado que reporto el Arduino, con su origen:
        `auto` (lo decidio el firmware) o `manual` (una persona: trae su
        nombre), y el motivo (`Tierra al 42 %, abajo del objetivo de 50 %`,
        `Objetivo alcanzado`, `Tiempo maximo (60 s)`, `Orden manual`…). Los
        mas recientes primero. Todos los roles; un `producer` solo su vivero.
      operationId: listActuatorEvents
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Acciones de los equipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorEventList'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /greenhouses/{greenhouse_id}/alerts:
    parameters:
      - name: greenhouse_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Background'
    get:
      tags: [alerts]
      summary: Alertas del vivero (ALERT-01)
      description: |
        Los umbrales del rabano viven en el firmware (`vivero_sensoresV2.ino`):
        el Arduino compara cada lectura y manda codigos. Con cada lote de la
        ingesta, el backend convierte los **codigos de limite** en alertas:

        | Codigo | Sensor | Umbral del firmware |
        |---|---|---|
        | `TEMP_ALTA` / `TEMP_BAJA` | `temp_c` | `> TEMP_LIMITE_MAX` / `< TEMP_LIMITE_MIN` |
        | `HUM_AIRE_ALTA` / `HUM_AIRE_BAJA` | `hum_aire_pct` | `> HUMA_LIMITE_MAX` / `< HUMA_LIMITE_MIN` |
        | `SUELO_ENCHARCADO` / `SUELO_SECO` | `suelo_pct` | `> SUELO_LIMITE_MAX` / `< SUELO_LIMITE_MIN` |
        | `TANQUE_UN_CUARTO` | `nivel_pct` | `<= NIVEL_PCT_CRITICO` |

        - Se crea en la misma peticion de ingesta en que llega la lectura,
          con sensor, dispositivo, valor, umbral (numero y constante) y hora.
        - Mientras el codigo siga llegando se actualiza la MISMA alerta
          (`last_value`, `worst_value`): no hay duplicados.
        - Se cierra cuando el codigo lleva `SMARTGREENAI_ALERT_CLEAR_SECONDS`
          (60) seguidos sin llegar. Un aviso `*_LEVE` cuenta como "de vuelta".
        - Los avisos (`*_LEVE`, `TANQUE_MITAD`, `SOMBRA_PROLONGADA`,
          `SOL_INSUFICIENTE`) y las fallas (`FALLA_*`) no crean alertas.

        Orden: primero las activas, luego las mas recientes. Todos los roles;
        un `producer` solo su vivero.
      operationId: listAlerts
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, cleared, all]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Alertas del vivero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Key emitida al registrar el dispositivo. Para el prototipo es
        suficiente; no es apto para produccion real.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token obtenido en `POST /auth/login`. Solo identifica la sesion; el
        rol se valida contra la BD en cada request.

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Identificador unico del dispositivo, ej. `pi-vivero-01`
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
    Background:
      name: X-SG-Background
      in: header
      required: false
      description: |
        Mandar `1` en los refrescos automaticos del dashboard: la request se
        valida igual, pero no renueva el plazo de inactividad de la sesion.
      schema:
        type: string
        enum: ['1']
    ActuatorId:
      name: actuator_id
      in: path
      required: true
      description: Identificador unico del actuador, ej. `bomba-riego-01`
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{2,49}$'

  schemas:

    DeviceCreate:
      type: object
      required: [device_id, greenhouse_id, type]
      properties:
        device_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: pi-vivero-01
        greenhouse_id:
          type: string
          description: FK al vivero al que pertenece
          example: vivero-rabano-01
        type:
          type: string
          enum: [gateway, sensor, actuator]
        model:
          type: string
          example: Raspberry Pi 1 Model B+ v1.2
        location:
          type: string
          description: Descripcion libre de donde esta fisicamente
          example: Mesa del laboratorio, junto al tanque

    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceCreate'
        - type: object
          properties:
            status:
              type: string
              enum: [active, inactive]
            registered_at:
              type: string
              format: date-time
            last_seen_at:
              type: string
              format: date-time
              nullable: true
              description: '`null` si nunca ha enviado una lectura'

    DeviceWithKey:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            api_key:
              type: string
              description: Se devuelve UNA sola vez, al registrar

    ReadingBatch:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Reading'

    Reading:
      type: object
      description: |
        Una lectura del Arduino, enriquecida por la Pi con el timestamp.
        Los nombres de campo son exactamente los que imprime el sketch
        `vivero_sensores.ino` por Serial: la Pi no renombra nada, solo agrega
        `ts` y reenvia.
      required: [ts]
      properties:
        ts:
          type: string
          format: date-time
          description: |
            Momento de la lectura en ISO 8601 con zona horaria. Lo asigna la
            Raspberry Pi al recibir la linea por Serial, NO el Arduino, y solo
            cuando su reloj esta sincronizado por NTP. El backend lo guarda en
            UTC con milisegundos. Sin zona horaria, anterior a 2026-01-01 o mas
            de 300 s en el futuro se rechaza (ver la ingesta).
          example: '2026-09-13T21:04:22.123Z'
        ms:
          type: integer
          format: int64
          description: |
            Milisegundos desde el boot del Arduino. Sirve para detectar
            reinicios (si baja respecto a la lectura anterior, hubo reset).
            No usar para ordenar en el tiempo.
          example: 148022

        temp_c:
          type: number
          format: float
          nullable: true
          description: Temperatura del aire en grados Celsius (DHT11)
          example: 24.2
        hum_aire_pct:
          type: number
          format: float
          nullable: true
          description: Humedad relativa del aire en % (DHT11)
          example: 72.0

        suelo_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: 'Lectura ADC cruda del sensor capacitivo. Mas seco = mas alto'
          example: 380
        suelo_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            Humedad de tierra en %, derivada de `suelo_raw` con la calibracion
            vigente. Es un valor relativo a esa calibracion, no humedad
            volumetrica del suelo.
          example: 62

        nivel_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          example: 150
        nivel_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: |
            Nivel del tanque en %. Mide solo el tramo que cubre el sensor, no
            el volumen total del tanque. `0` es un tanque vacio real; sensor
            desconectado llega como `null`.
          example: 75

        luz_raw:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: Lectura cruda del sensor de luz, sin calibrar a lux
          example: 306
        luz_nivel:
          type: integer
          minimum: 0
          maximum: 1023
          nullable: true
          description: |
            La misma lectura normalizada a "mas alto = mas luz", para que el
            backend no necesite saber la polaridad del sensor.
          example: 717

        co2_ppm:
          type: integer
          minimum: 0
          maximum: 40000
          nullable: true
          description: |
            Concentracion de CO2 en partes por millon (ppm) medida por el sensor
            Sensirion SCD40/SCD41 en el bus I2C (0x62, pines A4/A5). `null` si
            el sensor no responde, falla su CRC o el dato tiene mas de 15 s.
          example: 450

        es_dia:
          type: boolean
          description: |
            Dia o noche deducido del propio sensor de luz (el Arduino no tiene
            reloj). El dashboard no debe alertar por falta de sol cuando es
            `false`.
        sol_min_hoy:
          type: integer
          minimum: 0
          description: Minutos de sol pleno acumulados en el dia en curso
          example: 42
        sol_min_prev:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Minutos de sol del dia anterior ya cerrado. `null` mientras no se
            haya completado un ciclo dia-noche desde el ultimo reinicio.
          example: 410

        riego_sugerido:
          type: boolean
          description: |
            El Arduino sugiere regar. Es una recomendacion, no una orden:
            el principio del proyecto es decision support, not autonomy.
        bomba_habilitada:
          type: boolean
          description: |
            `false` cuando el nivel esta en critico o el sensor de nivel fallo.
            Bloqueo de seguridad: la bomba es sumergible y se quema en seco.
        vent:
          type: string
          enum: [BASE, ALTA]
          description: |
            Ventilacion recomendada. `BASE` es la ventilacion constante que el
            cultivo requiere siempre; `ALTA` por calor o exceso de humedad.
        bomba_activa:
          type: boolean
          description: |
            (v1.4.0) La bomba quedo encendida en esta lectura. Es lo que el
            firmware ordeno en el pin, no una medicion de que el motor gire.
            Alimenta el estado del actuador tipo `pump` de este gateway.
        vent_activo:
          type: boolean
          description: |
            (v1.4.0) El ventilador quedo encendido. Alimenta el estado del
            actuador tipo `fan` de este gateway.
        modo:
          type: string
          enum: [AUTO, MANUAL]
          description: |
            (v1.4.0, ACT-02) `AUTO`: el Arduino riega solo con sus constantes.
            `MANUAL`: no riega solo, solo obedece ordenes. Si no viene, el
            firmware no acepta ordenes de la plataforma.
        cmd_id:
          type: integer
          minimum: 0
          description: (v1.4.0) Ultima orden aplicada (`0` al arrancar)
        cmd_err:
          type: string
          nullable: true
          pattern: '^[A-Z_]{1,20}$'
          description: |
            (v1.4.0) Por que no aplico la orden `cmd_id`: `MODO` (bomba en
            automatico), `TANQUE` (tanque critico) o `FORMATO`.
        bomba_paro:
          type: string
          nullable: true
          pattern: '^[A-Z_]{1,20}$'
          description: |
            (v1.4.0) Por que se apago la bomba la ultima vez: `OBJETIVO`,
            `TIEMPO`, `TANQUE`, `SENSOR`, `MODO` u `ORDEN`.

        estado:
          type: string
          enum: [OK, AVISO, ALERTA]
          description: |
            Resumen de la lectura. `AVISO` = fuera del rango ideal del rabano;
            `ALERTA` = fuera de limite o sensor caido.
        alertas:
          type: array
          description: |
            Codigos activos en esta lectura. Enum cerrado: si el firmware agrega
            uno nuevo, se actualiza este spec primero.
          items:
            type: string
            enum:
              - TEMP_ALTA
              - TEMP_BAJA
              - TEMP_ALTA_LEVE
              - TEMP_BAJA_LEVE
              - HUM_AIRE_ALTA
              - HUM_AIRE_BAJA
              - HUM_AIRE_ALTA_LEVE
              - HUM_AIRE_BAJA_LEVE
              - SUELO_ENCHARCADO
              - SUELO_SECO
              - SUELO_HUMEDO_LEVE
              - SUELO_SECO_LEVE
              - TANQUE_MITAD
              - TANQUE_UN_CUARTO
              - SOMBRA_PROLONGADA
              - SOL_INSUFICIENTE
              - CO2_ALTO
              - CO2_BAJO
              - CO2_ALTO_LEVE
              - CO2_BAJO_LEVE
              - FALLA_DHT
              - FALLA_SUELO
              - FALLA_NIVEL
              - FALLA_CO2
          example: [SUELO_SECO, TANQUE_MITAD]

    StoredReading:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
            device_id:
              type: string
            greenhouse_id:
              type: string
            received_at:
              type: string
              format: date-time
              description: |
                Cuando el backend recibio la lectura. Distinto de `ts` cuando
                la Pi estuvo sin internet y sincronizo despues.
        - $ref: '#/components/schemas/Reading'

    IngestResult:
      type: object
      properties:
        accepted:
          type: integer
          description: Lecturas almacenadas
          example: 118
        duplicates:
          type: integer
          description: Ignoradas por `device_id` + `ts` repetido
          example: 2
        rejected:
          type: array
          description: Lecturas invalidas del lote, con su indice en el array
          items:
            type: object
            properties:
              index:
                type: integer
              reason:
                type: string
          example:
            - index: 44
              reason: 'ts: sin zona horaria: agrega Z (UTC) o un desfase como -06:00'
            - index: 45
              reason: 'suelo_pct: ensure this value is less than or equal to 100'
        commands:
          type: array
          description: |
            (v1.4.0, ACT-02) Ordenes pendientes para el Arduino de este
            gateway, en el orden en que deben escribirse.
          items:
            $ref: '#/components/schemas/GatewayCommand'

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Codigo estable, legible por maquina
          example: device_not_registered
        message:
          type: string
          description: Explicacion para humanos
          example: 'El dispositivo pi-vivero-01 no esta registrado'

    # ── Sprint 2: usuarios ────────────────────────────────────────────

    Role:
      type: string
      enum: [producer, admin, super_admin]
      description: |
        `producer` = Radish Producer, `admin` = Administrator,
        `super_admin` = Super Administrator.

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Usuario o email (no distingue mayusculas)
          example: productor
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    UserPublic:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
          example: productor
        email:
          type: string
          example: productor@smartgreen.local
        full_name:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        greenhouse_id:
          type: string
          nullable: true
          description: Vivero asignado a un productor. `null` para administradores.
          example: vivero-rabano-01

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_at, idle_timeout_minutes, user]
      properties:
        access_token:
          type: string
          description: 'JWT HS256 para el header `Authorization: Bearer <token>`'
        token_type:
          type: string
          example: bearer
        expires_at:
          type: string
          format: date-time
          description: Vencimiento absoluto de la sesion (8 h por defecto)
        idle_timeout_minutes:
          type: integer
          description: La sesion se cierra tras estos minutos sin actividad
          example: 30
        user:
          $ref: '#/components/schemas/UserPublic'

    # ── Sprint 2: actuadores ──────────────────────────────────────────

    ActuatorType:
      type: string
      enum: [pump, fan, shade, light]
      description: bomba de riego, ventilador, malla sombra, iluminacion

    ActuatorStatus:
      type: string
      enum: [active, inactive]

    ActuatorCreate:
      type: object
      required: [actuator_id, name, type, greenhouse_id, area, control_channel]
      properties:
        actuator_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: bomba-riego-01
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Bomba de riego
        type:
          $ref: '#/components/schemas/ActuatorType'
        greenhouse_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          example: vivero-rabano-01
        area:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
          example: general
        control_channel:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9/_.:-]{0,49}$'
          description: Canal fisico que lo controla (driver/pin)
          example: L298N-B/D5
        gateway_device_id:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9-]{2,49}$'
          description: Gateway registrado del mismo vivero que le enviara comandos
          example: pi-vivero-01
        model:
          type: string
          nullable: true
          maxLength: 120
          example: Bomba sumergible 12 V, canal B del L298N

    ActuatorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo estos campos son editables. `type` y `greenhouse_id` no.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        area:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
        control_channel:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9/_.:-]{0,49}$'
        model:
          type: string
          nullable: true
          maxLength: 120
        status:
          $ref: '#/components/schemas/ActuatorStatus'

    Actuator:
      allOf:
        - $ref: '#/components/schemas/ActuatorCreate'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/ActuatorStatus'
            registered_at:
              type: string
              format: date-time
            registered_by:
              type: integer
              nullable: true
              description: Id del usuario que lo registro
            updated_at:
              type: string
              format: date-time
              nullable: true
            deactivated_at:
              type: string
              format: date-time
              nullable: true

    # ── Sprint 2: ultimas lecturas ────────────────────────────────────

    LatestMetric:
      type: object
      required: [key, label, unit, stale, sensor_down]
      properties:
        key:
          type: string
          enum: [temp_c, hum_aire_pct, suelo_pct, nivel_pct, luz_nivel, co2_ppm]
        label:
          type: string
          example: Temperatura del aire
        unit:
          type: string
          example: °C
        value:
          type: number
          nullable: true
          description: Ultimo valor NO nulo. `null` si nunca ha llegado uno.
          example: 24.2
        raw:
          type: integer
          nullable: true
          description: Lectura ADC cruda del mismo momento (suelo, nivel y luz)
        ts:
          type: string
          format: date-time
          nullable: true
        age_seconds:
          type: integer
          nullable: true
        stale:
          type: boolean
        sensor_down:
          type: boolean
        device_id:
          type: string
          nullable: true
        device_location:
          type: string
          nullable: true
        area:
          type: string
          description: |
            Area del vivero a la que pertenece la medicion. El prototipo es un
            solo ambiente, asi que hoy siempre vale
            `SMARTGREENAI_DEFAULT_AREA` (`general`, igual que los actuadores).
            Cuando exista el registro de sensores por area (CONF-04) traera
            el area real.
          example: general

    GreenhouseSummary:
      type: object
      required: [greenhouse_id, devices]
      properties:
        greenhouse_id:
          type: string
          example: vivero-rabano-01
        devices:
          type: integer
          description: Dispositivos registrados en el vivero
          example: 1
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Ultima vez que uno de sus dispositivos envio lecturas

    LatestReadingSummary:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        age_seconds:
          type: integer
        stale:
          type: boolean
        device_id:
          type: string
        estado:
          type: string
          enum: [OK, AVISO, ALERTA]
          nullable: true
        alertas:
          type: array
          items:
            type: string
        riego_sugerido:
          type: boolean
          nullable: true
        bomba_habilitada:
          type: boolean
          nullable: true
        vent:
          type: string
          enum: [BASE, ALTA]
          nullable: true
        es_dia:
          type: boolean
          nullable: true

    LatestReadings:
      type: object
      required: [greenhouse_id, generated_at, stale_after_minutes, has_data, metrics]
      properties:
        greenhouse_id:
          type: string
        generated_at:
          type: string
          format: date-time
        stale_after_minutes:
          type: integer
          example: 15
        has_data:
          type: boolean
        last_reading:
          allOf:
            - $ref: '#/components/schemas/LatestReadingSummary'
          nullable: true
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/LatestMetric'

    # ── Sprint 2: estado de los equipos (ACT-04) ──────────────────────

    PowerState:
      type: string
      enum: [on, off, unavailable, unknown]
      description: |
        `unknown` = sin confirmacion del Arduino (o confirmacion vieja). Nunca
        se usa `off` sin confirmacion.

    PowerReason:
      type: string
      enum: [reported, tank_low, gateway_inactive, no_gateway, not_reported, never_reported, stale]
      description: |
        Por que el estado es el que es: `reported` (confirmado hace poco),
        `tank_low` (bomba bloqueada por tanque bajo), `gateway_inactive`,
        `no_gateway`, `not_reported` (el firmware no reporta ese tipo),
        `never_reported` o `stale` (confirmacion vieja).

    ActuatorLive:
      type: object
      required: [actuator_id, name, type, area, control_channel, state, reason, detail]
      properties:
        actuator_id:
          type: string
          example: bomba-riego-01
        name:
          type: string
          example: Bomba de riego
        type:
          $ref: '#/components/schemas/ActuatorType'
        area:
          type: string
          example: general
        control_channel:
          type: string
          example: L298N-B/D5
        gateway_device_id:
          type: string
          nullable: true
          example: pi-vivero-01
        state:
          $ref: '#/components/schemas/PowerState'
        reason:
          $ref: '#/components/schemas/PowerReason'
        detail:
          type: string
          description: Explicacion corta en espanol para la UI
          example: Confirmado por el Arduino.
        reported_at:
          type: string
          format: date-time
          nullable: true
          description: Hora (UTC) de la lectura que reporto el estado
        age_seconds:
          type: integer
          nullable: true
          description: Segundos desde esa lectura
        last_command:
          allOf:
            - $ref: '#/components/schemas/CommandOut'
          nullable: true
          description: Ultima orden manual a este equipo en los ultimos 10 min (ACT-02)

    ActuatorLiveList:
      type: object
      required: [greenhouse_id, generated_at, stale_after_minutes, actuators]
      properties:
        greenhouse_id:
          type: string
        generated_at:
          type: string
          format: date-time
        stale_after_minutes:
          type: integer
          description: Una confirmacion mas vieja que esto se muestra como `unknown`
          example: 15
        actuators:
          type: array
          items:
            $ref: '#/components/schemas/ActuatorLive'

    # ── Sprint 2: riego (ACT-02) ───────────────────────────────────────

    GatewayCommand:
      type: object
      required: [id, kind, value]
      description: |
        Orden para el Arduino que el gateway escribe por Serial:
        `SG,<id>,MODO,<value>` (kind `mode`) o `SG,<id>,BOMBA,<value>` (kind `pump`).
      properties:
        id:
          type: integer
          minimum: 1
          example: 18
        kind:
          type: string
          enum: [mode, pump]
        value:
          type: string
          enum: [AUTO, MANUAL, 'ON', 'OFF']
        actuator_id:
          type: string
          nullable: true
          example: bomba-riego-01

    CommandCreate:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: ['on', 'off']

    CommandOut:
      type: object
      required: [id, kind, value, trigger, reason, status, created_at]
      properties:
        id:
          type: integer
        actuator_id:
          type: string
          nullable: true
        kind:
          type: string
          enum: [mode, pump]
        value:
          type: string
          enum: [AUTO, MANUAL, 'ON', 'OFF']
        trigger:
          type: string
          enum: [manual, system]
          description: |
            `manual` = la pidio una persona; `system` = el backend re-sincroniza
            el modo despues de un reinicio del Arduino.
        reason:
          type: string
          example: 'Orden manual: regar'
        status:
          type: string
          enum: [pending, sent, confirmed, rejected, expired, superseded]
        error:
          type: string
          nullable: true
          description: '`cmd_err` del Arduino si la rechazo (MODO, TANQUE, FORMATO)'
        user_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true

    FirmwareIrrigation:
      type: object
      required: [target_pct, max_run_seconds, rest_seconds]
      description: Parametros de riego del firmware (solo lectura)
      properties:
        target_pct:
          type: number
          example: 50
          description: SUELO_LIMITE_MIN
        max_run_seconds:
          type: integer
          example: 60
          description: BOMBA_MAX_MS
        rest_seconds:
          type: integer
          example: 300
          description: BOMBA_DESCANSO_MS

    ModeChange:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual]

    IrrigationStatus:
      type: object
      required: [greenhouse_id, mode, controllable, detail, firmware]
      properties:
        greenhouse_id:
          type: string
        mode:
          type: string
          enum: [auto, manual]
          description: Modo elegido en la plataforma (`auto` por defecto)
        reported_mode:
          type: string
          enum: [auto, manual]
          nullable: true
          description: Modo que reporta el Arduino; `null` si no acepta ordenes
        controllable:
          type: boolean
        detail:
          type: string
          example: El Arduino acepta ordenes de la plataforma.
        controller_device_id:
          type: string
          nullable: true
          example: pi-vivero-01
        reported_at:
          type: string
          format: date-time
          nullable: true
        mode_changed_at:
          type: string
          format: date-time
          nullable: true
        mode_changed_by:
          type: string
          nullable: true
        last_mode_command:
          allOf:
            - $ref: '#/components/schemas/CommandOut'
          nullable: true
          description: Ultima orden de cambio de modo en los ultimos 10 min
        firmware:
          $ref: '#/components/schemas/FirmwareIrrigation'

    ActuatorEventOut:
      type: object
      required: [id, actuator_id, actuator_name, actuator_type, event, origin, reason, reading_ts]
      properties:
        id:
          type: integer
        actuator_id:
          type: string
        actuator_name:
          type: string
        actuator_type:
          $ref: '#/components/schemas/ActuatorType'
        event:
          type: string
          enum: ['on', 'off']
        origin:
          type: string
          enum: [auto, manual]
          description: '`auto` = lo decidio el firmware; `manual` = una persona'
        reason:
          type: string
          example: Tierra al 42 %, abajo del objetivo de 50 %
        user_name:
          type: string
          nullable: true
        reading_ts:
          type: string
          format: date-time
          description: Hora de la lectura que reporto el cambio

    ActuatorEventList:
      type: object
      required: [greenhouse_id, events]
      properties:
        greenhouse_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActuatorEventOut'

    # ── Sprint 2: alertas (ALERT-01) ──────────────────────────────────

    AlertOut:
      type: object
      required: [id, greenhouse_id, area, metric, label, unit, device_id, code, direction,
                 threshold, threshold_name, comparison, value, reading_ts, created_at,
                 last_value, last_ts, worst_value, status, duration_seconds]
      properties:
        id:
          type: integer
        greenhouse_id:
          type: string
        area:
          type: string
          example: general
        metric:
          type: string
          enum: [temp_c, hum_aire_pct, suelo_pct, nivel_pct, co2_ppm]
          description: Sensor (campo de la lectura)
        label:
          type: string
          example: Temperatura del aire
        unit:
          type: string
          example: °C
        device_id:
          type: string
          example: pi-vivero-01
        code:
          type: string
          example: TEMP_ALTA
          description: Codigo de limite que mando el Arduino
        direction:
          type: string
          enum: [high, low]
        threshold:
          type: number
          example: 30.0
          description: Umbral que cruzo, tal como esta en el firmware
        threshold_name:
          type: string
          example: TEMP_LIMITE_MAX
        comparison:
          type: string
          enum: ['>', '<', '<=']
          description: Como compara el firmware
        value:
          type: number
          example: 31.2
          description: Valor que disparo la alerta
        reading_ts:
          type: string
          format: date-time
          description: Hora (UTC) de la medicion que la disparo
        created_at:
          type: string
          format: date-time
          description: Hora en que el backend la creo
        last_value:
          type: number
        last_ts:
          type: string
          format: date-time
          description: Ultima lectura que seguia fuera del limite
        worst_value:
          type: number
        status:
          type: string
          enum: [active, cleared]
        cleared_at:
          type: string
          format: date-time
          nullable: true
        cleared_ts:
          type: string
          format: date-time
          nullable: true
          description: Lectura con la que se cerro
        cleared_value:
          type: number
          nullable: true
        duration_seconds:
          type: integer
          description: Desde la medicion hasta el cierre (o hasta ahora)

    AlertList:
      type: object
      required: [greenhouse_id, generated_at, active_count, clear_after_seconds, alerts]
      properties:
        greenhouse_id:
          type: string
        generated_at:
          type: string
          format: date-time
        active_count:
          type: integer
        clear_after_seconds:
          type: integer
          example: 60
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertOut'

    MetricKey:
      type: string
      description: |
        Mediciones que se pueden graficar y analizar. Es el mismo catalogo
        que usan las ultimas lecturas y las alertas.
      enum: [temp_c, hum_aire_pct, suelo_pct, nivel_pct, luz_nivel, co2_ppm]
      default: temp_c

    SeriesPoint:
      type: object
      description: |
        Un punto de la grafica: una lectura, o el promedio de un bucket. En
        modo agregado `min` y `max` son el rango real del bucket.
      required: [ts, value, count]
      properties:
        ts:
          type: string
          format: date-time
          description: Hora de la lectura, o inicio del bucket (UTC)
        value:
          type: number
          description: Lectura, o promedio del bucket
          example: 24.2
        min:
          type: number
          nullable: true
          description: Minimo del bucket (`null` en modo crudo)
        max:
          type: number
          nullable: true
          description: Maximo del bucket (`null` en modo crudo)
        count:
          type: integer
          description: Lecturas que representa el punto (1 en modo crudo)
          example: 10

    ReadingSeries:
      type: object
      required:
        [greenhouse_id, metric, label, unit, from, to, generated_at,
         bucket_seconds, aggregated, max_points, reading_count, point_count,
         has_data, points]
      properties:
        greenhouse_id:
          type: string
          example: vivero-rabano-01
        metric:
          $ref: '#/components/schemas/MetricKey'
        label:
          type: string
          example: Temperatura del aire
        unit:
          type: string
          example: °C
        from:
          type: string
          format: date-time
          description: Inicio del rango consultado (incluido)
        to:
          type: string
          format: date-time
          description: Fin del rango consultado (excluido)
        generated_at:
          type: string
          format: date-time
        bucket_seconds:
          type: integer
          description: Tamano del bucket; `0` = lecturas sin agregar
          example: 600
        aggregated:
          type: boolean
          description: Los puntos son promedios, no lecturas
        max_points:
          type: integer
          example: 240
        reading_count:
          type: integer
          description: Lecturas CON valor en el rango
          example: 1440
        point_count:
          type: integer
          example: 144
        has_data:
          type: boolean
          description: '`false` = rango valido pero sin lecturas'
        value_min:
          type: number
          nullable: true
          description: Minimo de la serie (para la escala vertical)
        value_max:
          type: number
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'

    TrendDirection:
      type: string
      description: |
        Indicador de tendencia de una variable en el periodo.
        `insufficient_data` = no hay buckets suficientes para sostener una
        direccion (hacen falta 3).
      enum: [rising, falling, stable, insufficient_data]

    AnalysisGap:
      type: object
      description: Tramo del rango sin lecturas de esa medicion.
      required: [from, to, seconds, buckets]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        seconds:
          type: integer
          example: 1800
        buckets:
          type: integer
          example: 30

    VariableAnalysis:
      type: object
      required:
        [key, label, unit, trend, stable_band, samples, expected_samples,
         coverage_pct, readings_used, readings_missing, gaps]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        label:
          type: string
        unit:
          type: string
        trend:
          $ref: '#/components/schemas/TrendDirection'
        slope_per_hour:
          type: number
          nullable: true
          description: Pendiente de la recta ajustada, en unidades por hora
          example: 1.2
        change:
          type: number
          nullable: true
          description: Cambio que estima la recta entre el primer y el ultimo dato
          example: 7.2
        stable_band:
          type: number
          description: Cambio que se considera ruido; debajo de esto, `stable`
          example: 0.5
        observed_hours:
          type: number
          nullable: true
          description: Horas entre el primer y el ultimo dato (puede ser menos que el rango)
        first:
          type: number
          nullable: true
        last:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        fit_r2:
          type: number
          nullable: true
          description: 0 a 1; que tan bien la recta explica la serie
        samples:
          type: integer
          description: Buckets con dato
        expected_samples:
          type: integer
          description: Buckets que cubren el rango
        coverage_pct:
          type: number
          description: Porcentaje del periodo con dato
          example: 89.6
        readings_used:
          type: integer
          description: Lecturas que entraron a los promedios
        readings_missing:
          type: integer
          description: Lecturas del rango con esta medicion en `null` (sensor caido)
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisGap'

    AnalysisPeriod:
      type: object
      description: |
        Periodo y resolucion con los que se corrio el analisis. Va en la
        respuesta porque el indicador no significa nada sin el periodo, y
        porque es lo que hace falta para repetir el mismo analisis.
      required: [from, to, hours, bucket_seconds, expected_samples]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        hours:
          type: number
          example: 24
        bucket_seconds:
          type: integer
          example: 600
        expected_samples:
          type: integer
          example: 144

    GreenhouseAnalysis:
      type: object
      required: [greenhouse_id, generated_at, period, has_data, readings, variables]
      properties:
        greenhouse_id:
          type: string
        generated_at:
          type: string
          format: date-time
          description: Metadato de la respuesta; no entra en el calculo
        period:
          $ref: '#/components/schemas/AnalysisPeriod'
        has_data:
          type: boolean
        readings:
          type: integer
          description: Lecturas del vivero en el rango
        variables:
          type: array
          items:
            $ref: '#/components/schemas/VariableAnalysis'

    ErrorDetail:
      type: object
      description: |
        Formato real de los errores que lanza el backend (FastAPI envuelve el
        error en `detail`). Ver la nota en la descripcion del API.
      properties:
        detail:
          $ref: '#/components/schemas/Error'

    HTTPValidationError:
      type: object
      description: |
        Lo que responde FastAPI (con Pydantic v1) cuando un parametro o el
        cuerpo no pasan su validacion: una lista en `detail`, con los mensajes
        en ingles. No usa el formato `ErrorDetail` del backend.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                description: Donde esta el error, por ejemplo `["query", "limit"]`
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
              ctx:
                type: object
                description: Datos extra del error (por ejemplo, los valores permitidos)
            example:
              loc: [query, metric]
              msg: "value is not a valid enumeration member; permitted: 'temp_c', 'hum_aire_pct', 'suelo_pct', 'nivel_pct', 'luz_nivel'"
              type: type_error.enum

  responses:
    BadRequest:
      description: Payload invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: API key ausente, invalida o de otro dispositivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionRequired:
      description: |
        Sin token (`missing_token`), token invalido o vencido (`invalid_token`)
        o sesion terminada / inactiva mas de 30 min (`session_expired`).
        Incluye el header `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    Forbidden:
      description: El rol del usuario no tiene permiso (`forbidden`). La accion no se ejecuta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    ValidationError:
      description: |
        Cuerpo o parametros invalidos. Llega en una de dos formas:
        - FastAPI (tipo, enum o rango numerico de un parametro o del cuerpo):
          `detail` es una LISTA (`HTTPValidationError`), en ingles.
        - Una regla del endpoint (por ejemplo `nothing_to_update` o
          `not_controllable`): `detail` es `{error, message}` (`ErrorDetail`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorDetail'
              - $ref: '#/components/schemas/HTTPValidationError'
    InvalidRange:
      description: |
        El rango pedido no se puede consultar (`invalid_range`, forma
        `ErrorDetail`): `from` igual o posterior a `to`, mas de 90 dias,
        `from` o `to` sin zona horaria, una fecha en los extremos del
        calendario, o un `bucket_seconds` que parte el rango en mas de 1000
        tramos. Un parametro con un valor fuera de su enum o de su rango
        numerico lo rechaza FastAPI con su propio 422 (`HTTPValidationError`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorDetail'
              - $ref: '#/components/schemas/HTTPValidationError'
