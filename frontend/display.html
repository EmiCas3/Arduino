<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantalla externa en tiempo real · SmartGreenAI</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { var t = localStorage.getItem("sg.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/display.js"></script>
</head>
<body class="display-page">
  <header class="display-standalone-bar">
    <a class="brand-mark" href="panel.html#/inicio" aria-label="Volver al panel de SmartGreenAI">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1D7A4C"/>
        <path d="M16 13.2c-1.1-3.5-3.5-5.6-7.2-5.9.2 3.7 2.7 5.9 7.2 5.9z" fill="#C4F2D4"/>
        <path d="M16 13.2c1.1-3.5 3.5-5.6 7.2-5.9-.2 3.7-2.7 5.9-7.2 5.9z" fill="#8FE0AE"/>
        <path d="M16 12.6c-3.7 0-5.8 2.5-5.3 5.6.4 3 2.7 5.5 5.3 8.8 2.6-3.3 4.9-5.8 5.3-8.8.5-3.1-1.6-5.6-5.3-5.6z" fill="#F0588C"/>
      </svg>
      <span>
        <span class="brand-name">SmartGreenAI</span>
        <span class="brand-sub display-brand-sub">Monitor en tiempo real</span>
      </span>
    </a>
    <div class="display-standalone-actions">
      <button class="btn btn-quiet btn-sm" id="standalone-fullscreen" type="button"></button>
      <a class="btn btn-sm" id="standalone-panel-link" href="panel.html#/inicio">Volver al panel</a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar a tema oscuro"></button>
    </div>
  </header>

  <main class="display-standalone" id="display-standalone" tabindex="-1">
    <div class="display-board">
      <div class="skeleton-line" style="width: 240px; height: 28px"></div>
    </div>
  </main>
</body>
</html>
